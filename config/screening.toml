[markers.ring_holder_blue]
kind = "holder"
pos = [0.42, -0.07]
post_spacing = [0.025, 0.05]   # [across the ring, along it]
post_size = [0.007, 0.007, 0.035]
base_size = [0.045, 0.11, 0.004]
