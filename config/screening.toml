#   kind = "peg"   a post `height` tall; the peg leaves its top tilted by tilt_deg from straight
#                  up (0 = up, 90 = level), toward yaw_deg (180 = toward the robot); length, radius.
#                  The ring stands upright in its holder: a peg at tilt_deg needs it turned 90 - tilt_deg.
