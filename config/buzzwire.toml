# =============================================================================================
#  Robot Buzz Wire: configuration
# =============================================================================================
#  Guide a ring along a curved wire with the robot, without touching the wire.
#  Everything about the game is defined here. Check it with
#
#      python -m buzzwire.check_config
#
#  Units: metres, degrees, seconds, kilograms. Positions are in the room:
#      x = forward, away from the robot (its base is at x = 0)
#      y = to the robot's left
#      z = up from the floor (the table top is at z = 0.75)
#  Wire points are given relative to the wire board's centre: [forward, left, up].
# =============================================================================================

version = 1

# ---------------------------------------------------------------------------- the robot
[robot]
model = "ur5e"                 # "ur5e": Universal Robots UR5e (MuJoCo Menagerie); more later
gripper = "robotiq_2f85"       # "robotiq_2f85": Robotiq 2F-85 two-finger gripper
base = [0.0, 0.0]              # where its base stands on the table [x, y]
# start pose (shoulder pan, shoulder lift, elbow, wrist 1, 2, 3): gripper pointing down,
# about 30 cm in front of the base
home_deg = [0.0, -100.0, 110.0, -100.0, -90.0, 0.0]
max_speed = 0.4                # [m/s] top speed of the gripper, after the smoothing (as in the screening test)
max_turn_deg = 90              # [deg/s] top turning speed of the gripper
joint_speed_deg = 180          # [deg/s] top speed of each joint (a UR5e's limit)
arm_clearance = 0.02           # the forearm and wrist keep at least this far above the table [m]
finger_clearance = 0.003       # every part of the gripper at least this far (the fingers can reach down to grab)
servo_stiffness = 1.0          # x the UR5e's joint motor stiffness (1 = the real one; 3 follows a little quicker but is twitchy)
servo_feedforward = true       # the joint motors also get the commanded velocity (as a real robot's servo):
                               # they follow without trailing ~0.1 s behind, no stiffer

[controls]
motion_scale = 1.0             # the robot moves this many cm per cm the phone moves
# Smoothing of the phone's motion, as in the screening test (vrteleop/arms.py): "simple" = each
# control tick the target moves a fraction 1 - exp(-dt / smoothing_s) of the way toward the hand
# (position and rotation). The same delay at every hand speed, so the robot is predictable; it
# also evens out the phone's ~30 poses a second and the tracking's small noise.
filter = "simple"
smoothing_s = 0.12             # [s] the filter's time constant
# "one_euro" (adaptive: strong when the hand is still, weak when it moves fast) is still there to
# try; its delay changes with the hand's speed, which candidates found harder to predict.
min_cutoff_hz = 0.3            # (one_euro) how strongly a still hand is smoothed (lower = calmer)
beta = 10.0                    # (one_euro) how fast the smoothing lets go as the hand speeds up [per m/s]
rot_beta = 2.0                 # (one_euro) the same for turning [per rad/s]
glide_s = 0.025                # (one_euro) glide between phone samples [s]
input_timeout_s = 0.35         # no controller message for this long: MOVE counts as released (the arm
                               # holds still); when messages come back the clutch re-anchors (no jump)
# A jitter buffer (off, as in the screening test: the 0.12 s smoothing already evens the phone's
# messages out): keep them with the phone's timestamps and play them back evenly, a little later,
# just enough to cover how uneven the connection is, between these two. 0 = off.
jitter_buffer_s = 0.0
jitter_buffer_max_s = 0.15

# ---------------------------------------------------------------------------- physics
[physics]
timestep = 0.002               # [s] one physics step (500 per second)
control_hz = 100               # the arm's target is updated this often
touch_debounce_s = 0.05        # contact lost for less than this still counts as one touch

# ---------------------------------------------------------------------------- what the player sees
[view]                         # as in the screening test: from the robot's "head", looking down at the table
eye = [-0.25, -0.05, 1.65]     # camera position [x, y, z]: just behind the robot's base, at head height
look_at = [0.50, 0.0, 0.75]    # the point it looks at: the middle of the work area (the board, the cubes)
fov_deg = 50                   # (adjusted from the screening test's 55 so the work area fills the middle)
arm_opacity = 0.25             # the arm is drawn solid; its big links (base, shoulder, upper arm, forearm)
                               # fade to this only while they hide the gripper or the spot below it

[side_view]                    # a small second view in the top-right corner: the gripper from the side,
enabled = true                 # at table height, so its height above the table is easy to see
from = "left"                  # the robot's left (or "right")
size = 0.28                    # its width, as a share of the screen's
distance = 0.6                 # [m] from the gripper (things nearer the camera than 15 cm short of the
                               # gripper are cut away, so the arm doesn't block it)
height = 0.08                  # [m] above the table: where the camera is and looks (it follows the gripper)
fov_deg = 35

[depth_cues]                   # a ring on the table straight below the gripper and a line down to it
enabled = true
grab_height = 0.06             # they turn green when the finger pads are this low (low enough to grab)
color = "#ffd24a"
grab_color = "#4cd07d"

# ---------------------------------------------------------------------------- the board, wire and wand
[board]                        # the wooden base the wire posts stand on
center = [0.50, 0.0]           # [x, y] on the table
size = [0.16, 0.56, 0.02]      # [depth, width, thickness]

[wire]
radius = 0.0015                # the metal wire is 3 mm thick
sleeve_length = 0.045          # a rubber sleeve on each end: touching it doesn't count
sleeve_radius = 0.004
post_radius = 0.006            # the posts holding the wire's ends

[wand]                         # a handle with a loop at its front end; the loop goes around the wire
loop_radius = 0.02             # from the loop's centre to the middle of its metal [m]: the default; levels can change it
loop_thickness = 0.004         # the loop's metal is this thick
loop_segments = 24             # the loop is made of this many short pieces
handle_size = [0.12, 0.014, 0.014]   # [length, width, height]; the gripper holds it
handle_mass = 0.04
loop_mass = 0.01
friction = [1.5, 0.02, 0.002]  # sliding, twisting, rolling (a rubber-coated handle)

# ---------------------------------------------------------------------------- scoring
# Per level, 0 to 100:
#     progress    x how far along the wire the ring got (1 = hung on the end hook)
#   + no_touches  x (1 - touches / touches_to_zero)
#   + touch_time  x (1 - seconds touching / touch_seconds_to_zero)
#   + time        x time left / time limit        (only if completed)
#   + smoothness  x 1 at rms jerk <= smooth_jerk, 0 at >= jerky_jerk (m/s^3), in between linear
# Overall = the mean of the scored levels; pass = overall >= pass_mark.
[scoring]
progress = 40
no_touches = 25
touch_time = 15
time = 10
smoothness = 10
touches_to_zero = 10
touch_seconds_to_zero = 5.0
smooth_jerk = 5.0
jerky_jerk = 60.0
pass_mark = 50

# ---------------------------------------------------------------------------- levels
# In order. Each level:
#   points         the wire's shape: [forward, left, up] from the board's centre, start to end
#                  (a smooth curve is drawn through them). Start on the right (negative "left").
#   rotation       "none": the ring keeps its angle (just slide it along);
#                  "yaw": it turns left / right with the phone and stays upright;
#                  "full": it also tilts and twists with the phone (six degrees of freedom)
#   loop_radius    the ring's size [m] (from its centre to the middle of its metal): bigger = easier.
#                  The wire must not bend tighter than 1.5 x this.
#   start_held     true: the wand starts in the robot's hand, its loop around the wire;
#                  false: it rests on the start fork and has to be picked up first
#   finish         "reach_end": done when the ring gets to the red sleeve at the far end;
#                  "hang": set the wand on the end hook (fork) and let go
#   time_limit_s, scored (false = practice)

[[levels]]
key = "straight"
title = "Level 1: straight"
text = "The robot holds the ring around the wire. Hold the pad and slide it to the red end without touching the wire."
scored = false
time_limit_s = 180
rotation = "none"
loop_radius = 0.035
points = [[0.0, -0.18, 0.13], [0.0, 0.18, 0.13]]

[[levels]]
key = "curves"
title = "Level 2: gentle curves"
text = "The wire bends left and right. Turn your phone a little to keep the ring square to it."
scored = true
time_limit_s = 240
rotation = "yaw"
loop_radius = 0.03
points = [[0.0, -0.21, 0.13], [0.012, -0.11, 0.13], [-0.012, 0.0, 0.13], [0.012, 0.11, 0.13], [0.0, 0.21, 0.13]]

[[levels]]
key = "space"
title = "Level 3: up and down"
text = "Now the wire also goes up and down. Tilt your phone to follow it."
scored = true
time_limit_s = 300
rotation = "full"
loop_radius = 0.026
points = [[0.0, -0.21, 0.13], [0.01, -0.11, 0.155], [-0.01, 0.0, 0.125], [0.01, 0.11, 0.155], [0.0, 0.21, 0.135]]

# =============================================================================================
#  Cube tasks: the screening test's pick-and-place tasks with this game's robot and graphics.
#  The tasks themselves (objects, outlines, bins, steps, time limits, scoring) are defined in
#  config/screening.toml; here: which of its phases, in order.
# =============================================================================================
[cubes]
phases = ["pick", "shapes", "sort"]    # practice: cube into the square; task 1: shapes; task 2: sorting

# =============================================================================================
#  Tower: stack blocks as high as you can. Blocks appear one at a time at the supply spot; take
#  each to the platform and stack it. Score: height reached (60), no blocks fallen (20), grasps
#  that worked (20). A block that was on the tower and ends up on the table has fallen.
# =============================================================================================
[tower]
platform_center = [0.52, 0.06]         # the wooden platform the tower is built on [x, y]
platform_size = [0.14, 0.14, 0.02]     # [x, y, height]
supply = [0.42, -0.18]                 # where the next block appears
block_mass = 0.06                      # [kg] each block
friction = [1.0, 0.01, 0.001]          # sliding, twisting, rolling (wood on wood)

[[tower.levels]]
key = "practice"
title = "Practice: a small tower"
text = "Take each cube from the yellow spot and stack it on the wooden platform. Lower it gently, then RELEASE."
scored = false
time_limit_s = 150
rotation = "yaw"
target_height = 0.15
blocks = [{ size = [0.05, 0.05, 0.05], color = "#e63946" },
          { size = [0.05, 0.05, 0.05], color = "#e9c46a" },
          { size = [0.05, 0.05, 0.05], color = "#457b9d" }]

[[tower.levels]]
key = "cubes"
title = "Tower 1: cubes"
text = "Pick up each cube as it appears and stack them on the wooden platform. Build as high as you can!"
scored = true
time_limit_s = 180
rotation = "yaw"
target_height = 0.25                   # a tower this high scores full marks for height
blocks = [{ size = [0.05, 0.05, 0.05], color = "#e63946", count = 1 },
          { size = [0.05, 0.05, 0.05], color = "#f4a261", count = 1 },
          { size = [0.05, 0.05, 0.05], color = "#e9c46a", count = 1 },
          { size = [0.05, 0.05, 0.05], color = "#2a9d8f", count = 1 },
          { size = [0.05, 0.05, 0.05], color = "#457b9d", count = 1 },
          { size = [0.05, 0.05, 0.05], color = "#8e5bd8", count = 1 }]

[[tower.levels]]
key = "mixed"
title = "Tower 2: mixed blocks"
text = "Bricks and planks this time. Turn them to fit and keep the tower balanced."
scored = true
time_limit_s = 240
rotation = "yaw"
target_height = 0.22
blocks = [{ size = [0.10, 0.05, 0.04], color = "#e63946" },
          { size = [0.05, 0.05, 0.05], color = "#f4a261" },
          { size = [0.12, 0.06, 0.025], color = "#e9c46a" },
          { size = [0.05, 0.05, 0.05], color = "#2a9d8f" },
          { size = [0.10, 0.05, 0.04], color = "#457b9d" },
          { size = [0.06, 0.06, 0.03], color = "#8e5bd8" },
          { size = [0.05, 0.05, 0.05], color = "#ef476f" }]

# =============================================================================================
#  The candidate's test (one personal link): welcome -> connect the phone -> tutorial ->
#  practice -> "ready?" (start the assessment, or practise again) -> assessment -> thank you.
#  Tasks are "game:level" (games: wire, cubes, tower; levels: the keys above, or the phases of
#  config/screening.toml for cubes). During the assessment the screen shows only a thin timer.
# =============================================================================================
[flow]
practice = ["wire:straight", "tower:practice"]          # after the tutorial; may be repeated
max_practice_rounds = 3                                 # rounds of practice a candidate may do
assessment = ["cubes:shapes", "cubes:sort", "wire:curves", "tower:cubes"]
card_seconds = 8                                        # the task card before each assessment task
default_controls = "motion"     # a new candidate's controls (the admin can change them per candidate):
                                # "motion" (move the phone: Android tracking / iPhone tilt), "touch"
                                # (two joysticks), "choice" (the candidate picks)
